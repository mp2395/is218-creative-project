{% extends 'base.html' %}{% block title %}Add a study session{% endblock %}{% block content %}<p class="eyebrow">Small steps add up</p><h1>What did you study?</h1><p>Record a session you have already completed. Your account owns the saved record.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form class="panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="subject">Subject</label><input id="subject" name="subject" maxlength="80" required value="{{ request.form.get('subject','') }}"><label for="session_date">Study date</label><input id="session_date" name="session_date" type="date" max="{{ today }}" required value="{{ request.form.get('session_date',today) }}"><label for="duration_minutes">Minutes studied</label><input id="duration_minutes" name="duration_minutes" type="number" min="1" max="1440" step="1" required value="{{ request.form.get('duration_minutes','') }}"><label for="note">Note <span class="hint">(optional, 240 characters)</span></label><textarea id="note" name="note" maxlength="240" rows="3">{{ request.form.get('note','') }}</textarea><button type="submit">Save session</button></form>{% endblock %}
